name: Source field probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/source-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Find which key sets Source on Sarah (person 1310443901) to Claude SEO
        shell: python
        run: |
          import json, urllib.request
          AUTH = "api_key=ZRMHN4uJotjRDcZa8hKi&app_key=571978be28bd3b5b515a2cc5db96b674"
          PID, SRC = 1310443901, 3630329
          URL = f"https://api.pipelinecrm.com/api/v3/people/{PID}.json?{AUTH}"
          def call(method, body=None):
              data = json.dumps(body).encode() if body else None
              req = urllib.request.Request(URL, data=data, method=method,
                                           headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status, json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:300]
          s, p = call("GET")
          print("BEFORE:", s, p.get("lead_source") if isinstance(p, dict) else p, "| last_name:", p.get("last_name") if isinstance(p, dict) else "")
          for body in ({"person": {"lead_source_id": SRC}},
                       {"person": {"source_id": SRC}},
                       {"person": {"lead_source": {"id": SRC}}}):
              s, r = call("PUT", body)
              s2, p = call("GET")
              got = (p.get("lead_source") or {}).get("id") if isinstance(p, dict) else None
              print("TRY", json.dumps(body), "-> PUT", s, "| lead_source now:", p.get("lead_source") if isinstance(p, dict) else p)
              if got == SRC:
                  print("WORKS WITH:", list(body["person"].keys())[0])
                  break
          s, r = call("PUT", {"person": {"last_name": "Silverstein"}})
          s, p = call("GET")
          print("AFTER: last_name:", p.get("last_name"), "| lead_source:", p.get("lead_source"))
